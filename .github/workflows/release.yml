# Generated: publishes the package when a tag v* is pushed and its tests pass. Do not edit, the next release replaces it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version of the package
        run: test "$GITHUB_REF_NAME" = "v1.3.1" || { echo "tag $GITHUB_REF_NAME, package v1.3.1"; exit 1; }
      - name: Wait for the SDK unione-rust-sdk 1.3.0 in crates.io
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://index.crates.io/un/io/unione-rust-sdk" && grep -qF '"vers":"1.3.0"' /tmp/sdk; then
              echo "unione-rust-sdk 1.3.0 is in crates.io"; exit 0
            fi
            echo "unione-rust-sdk 1.3.0 is not in crates.io yet ($i/180)"; sleep 30
          done
          echo "::error::unione-rust-sdk 1.3.0 did not appear in crates.io in 90 min: publish the SDK first"; exit 1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
