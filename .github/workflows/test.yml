# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        v: ["stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the SDK unione-rust-sdk 1.3.0 in crates.io
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://index.crates.io/un/io/unione-rust-sdk" && grep -qF '"vers":"1.3.0"' /tmp/sdk; then
              echo "unione-rust-sdk 1.3.0 is in crates.io"; exit 0
            fi
            echo "unione-rust-sdk 1.3.0 is not in crates.io yet ($i/180)"; sleep 30
          done
          echo "::error::unione-rust-sdk 1.3.0 did not appear in crates.io in 90 min: publish the SDK first"; exit 1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.v }}
      - run: |
          cargo test
